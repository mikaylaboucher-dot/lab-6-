
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dance Lessons | Contact</title>
    <link rel="stylesheet" href="css/bootstrap.min.css">
    <link rel="stylesheet" href="css/style.css">
    <script type="module" src="js/bootstrap.bundle.min.js"></script>
</head>
<body>
    <nav class="navbar md:navbar-expand bg-1 fg-2">
        <div class="container-fluid">
            <a class="navbar-brand" href="index.html">Dance Lessons</a>
            <button class="btn-icon navbar-toggler" type="button" data-bs-toggle="drawer"
                data-bs-target="#navbarNav" aria-controls="navbarNav"
                aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon" aria-hidden="true"></span>
            </button>
            <dialog class="drawer drawer-end" tabindex="-1" id="navbarNav"
                aria-labelledby="navbarNavLabel">
                <div class="drawer-header">
                    <h5 class="drawer-title" id="navbarNavLabel">Menu</h5>
                    <button type="button" class="btn-close"
                        data-bs-dismiss="drawer" aria-label="Close"></button>
                </div>
                <div class="drawer-body">
                    <ul class="navbar-nav">
                        <li class="nav-item">
                            <a class="nav-link" href="index.html">Home</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="#">Classes</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link active" aria-current="page"
                                href="contact.html">Contact</a>
                        </li>
                    </ul>
                </div>
            </dialog>
        </div>
    </nav>

    <main>
        <div class="container mt-5">
            <h1>Contact Dance Lessons</h1>
            <p>Have a question about one of our classes? Fill out the form below to contact us.</p>

            <form style="max-width: 900px" class="mx-auto">
                <div class="row g-4">
                    <div class="md:col-6">
                        <div class="form-field">
                            <label for="firstName" class="form-label">First name</label>
                            <input type="text" class="form-control" id="firstName" required>
                        </div>
                    </div>

                    <div class="md:col-6">
                        <div class="form-field">
                            <label for="lastName" class="form-label">Last name</label>
                            <input type="text" class="form-control" id="lastName">
                        </div>
                    </div>

                    <div class="md:col-6">
                        <div class="form-field">
                            <label for="email" class="form-label">Email</label>
                            <input type="email" class="form-control" id="email"
                                placeholder="name@example.com" required>
                        </div>
                    </div>

                    <div class="md:col-6">
                        <div class="form-field">
                            <label for="danceStyle" class="form-label">Dance style</label>
                            <select class="form-control" id="danceStyle">
                                <option value="">Choose a class</option>
                                <option value="hiphop">Hip Hop</option>
                                <option value="ballet">Ballet</option>
                                <option value="jazz">Jazz</option>
                                <option value="contemporary">Contemporary</option>
                                <option value="salsa">Salsa</option>
                                <option value="tap">Tap</option>
                            </select>
                        </div>
                    </div>

                    <div class="col-12">
                        <div class="form-field">
                            <label for="message" class="form-label">Message</label>
                            <textarea class="form-control" id="message" rows="5"></textarea>
                        </div>
                    </div>

                    <div class="col-12">
                        <div class="form-field">
                            <input type="checkbox" id="consent" class="check">
                            <label for="consent">I agree to be contacted</label>
                        </div>
                    </div>
                </div>

                <button type="submit" class="btn-solid theme-primary mt-5">
                    Contact Us
                </button>
            </form>
        </div>
    </main>

    <footer class="container-fluid mt-5">
        <p class="p-3 bg-1 border d-flex justify-content-center">
            Dance Lessons © 2026
        </p>
    </footer>
</body>
</html>
```
